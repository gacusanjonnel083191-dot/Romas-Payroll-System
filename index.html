<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ca1b1b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Roma's Payroll" />
    <meta name="description" content="Roma's Donuts Payroll & Attendance System" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      if (new URLSearchParams(window.location.search).get('app') === 'reseller-calculator') {
        document.documentElement.classList.add('reseller-calculator-app')
        document.querySelector('link[rel="manifest"]').setAttribute('href', '/reseller-calculator-manifest.json')
        document.querySelector('meta[name="apple-mobile-web-app-title"]')?.setAttribute('content', "Roma's Calculator")
        document.querySelector('meta[name="description"]')?.setAttribute('content', "Roma's Donuts daily reseller sales and settlement calculator")
        document.title = "Roma's Donuts Reseller Calculator"
      }
      window.addEventListener('beforeinstallprompt', event => {
        event.preventDefault()
        window.__romasInstallPrompt = event
        window.dispatchEvent(new CustomEvent('romasinstallready'))
      })
    </script>
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="stylesheet" href="/roma-ai.css?v=2026.08.12.14-resilient" />
    <link rel="stylesheet" href="/roma-ai-input-visibility.css?v=2026.08.12.16-inputfix" />
    <link rel="stylesheet" href="/staff-chat.css?v=2026.09.17.1" />
    <title>Roma's Donuts</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { height: 100%; }
      body { min-height: 100%; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
      #root { min-height: 100vh; }
      .reseller-calculator-app .staff-chat-root,
      .reseller-calculator-app #roma-ai-root { display: none !important; }
      @media print {
        @page { size: 145mm 210mm; margin: 0; }
        body > * { display: none !important; }
        .payslip-page { display: block !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/passkey-compat.js"></script>
    <script type="module" src="/src/main.jsx"></script>
    <script src="/roma-ai-resilience.js?v=2026.08.12.14-resilient"></script>
    <script src="/roma-ai-agent-upgrade.js?v=2026.08.13.4-general-agent-auth"></script>
    <script src="/roma-ai-diagnostics.js?v=2026.08.13.3-general-agent"></script>
    <script defer src="/roma-ai.js?v=2026.08.12.20-agent"></script>
    <script defer src="/staff-chat.js?v=2026.09.17.1"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.log('SW error:', err))
        })
      }
    </script>
  </body>
</html>

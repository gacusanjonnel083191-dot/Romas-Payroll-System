name: Apply invoice brand logo fix

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-invoice-brand-logo.cjs'
      - '.github/workflows/apply-invoice-brand-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply invoice brand/logo fix
        run: |
          node tools/apply-invoice-brand-logo.cjs
          cp src/App.jsx /tmp/App.invoice-brand-fixed.jsx

      - name: Check patch formatting
        run: git diff --check

      - name: Build production app
        run: npm run build

      - name: Restore exact verified source after build-time patches
        run: cp /tmp/App.invoice-brand-fixed.jsx src/App.jsx

      - name: Verify final source and fit budget
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const s = fs.readFileSync('src/App.jsx', 'utf8')
          const required = [
            "wordImageCell('rIdLogo', 450, { width:full, span:5 })], 520)",
            '<w:pgSz w:w="5760" w:h="8640"/>',
            'const MARGIN = 170',
            'downloadDeliveryInvoiceDocxFile(`Romas_Donuts_Invoices_4x6_${date}`, dayInvoices, logoBytes)',
            'downloadDeliveryInvoiceDocxFile(`Romas_Donuts_Invoice_4x6_${invoiceNumber}`, [freshInvoice], logoBytes)',
            '> PRINT ALL ({invoiceDayFilter})</button>',
            '> PRINT</button>'
          ]
          for (const needle of required) if (!s.includes(needle)) throw new Error(`Missing: ${needle}`)
          const forbidden = [
            'await downloadDeliveryInvoiceWordImageFile(`Romas_Donuts_Invoices_4x6_${date}`, dayInvoices)',
            'await downloadDeliveryInvoiceWordImageFile(`Romas_Donuts_Invoice_4x6_${invoiceNumber}`, [freshInvoice])',
            '> PRINT ALL PDF ({invoiceDayFilter})</button>',
            '> DOWNLOAD IMAGES</button>',
            '> DOWNLOAD PDF</button>'
          ]
          for (const needle of forbidden) if (s.includes(needle)) throw new Error(`Old behavior remains: ${needle}`)

          // Worst-case native Word row budget: logo + all fixed rows + 17 product rows.
          const usedTwips = 520 + 320 + (280 * 4) + 250 + (290 * 17) + 40 + 280 + 320 + 280
          const usableTwips = 8640 - (170 * 2)
          if (usedTwips > usableTwips) throw new Error(`Invoice rows exceed 4x6 page: ${usedTwips} > ${usableTwips}`)
          console.log(`Verified 4x6 fit: ${usedTwips}/${usableTwips} twips used.`)
          NODE
          git diff --check

      - name: Commit verified app change
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo 'No App.jsx change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          git commit -m 'Restore Roma branding and logo in 4x6 Word invoices'
          git push origin main

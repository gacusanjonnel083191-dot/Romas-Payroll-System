name: Apply branded native Word invoice fix

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-branded-native-word-invoice.cjs'
      - '.github/workflows/apply-branded-native-word-invoice.yml'
      - '.invoice-word-native-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply invoice fix
        run: node tools/apply-branded-native-word-invoice.cjs

      - name: Check patch formatting
        run: git diff --check

      - name: Build production app
        run: npm run build

      - name: Verify patch is idempotent
        run: |
          cp src/App.jsx /tmp/App.before-second-run.jsx
          node tools/apply-branded-native-word-invoice.cjs
          cmp -s src/App.jsx /tmp/App.before-second-run.jsx || { echo 'Patch is not idempotent'; exit 1; }

      - name: Commit verified app change
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo 'No App.jsx change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          git commit -m 'Restore branded native 4x6 Word invoice printing'
          git push origin main

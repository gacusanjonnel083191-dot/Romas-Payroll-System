name: Apply branded native Word invoice fix

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-branded-native-word-invoice.cjs'
      - '.github/workflows/apply-branded-native-word-invoice.yml'
      - '.invoice-word-native-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply invoice fix
        run: |
          node tools/apply-branded-native-word-invoice.cjs
          cp src/App.jsx /tmp/App.invoice-fixed.jsx

      - name: Check patch formatting
        run: git diff --check

      - name: Build production app
        run: npm run build

      - name: Restore exact verified invoice source after build-time patches
        run: cp /tmp/App.invoice-fixed.jsx src/App.jsx

      - name: Verify final invoice source
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const s = fs.readFileSync('src/App.jsx', 'utf8')
          const required = [
            'const widths = [1675, 1155, 863, 863, 864]',
            '<w:pgSz w:w="5760" w:h="8640"/>',
            'const MARGIN = 170',
            'downloadDeliveryInvoiceDocxFile(`Romas_Donuts_Invoices_4x6_${date}`, dayInvoices)',
            'downloadDeliveryInvoiceDocxFile(`Romas_Donuts_Invoice_4x6_${invoiceNumber}`, [freshInvoice])',
            '> PRINT ALL ({invoiceDayFilter})</button>',
            '> PRINT</button>'
          ]
          for (const needle of required) {
            if (!s.includes(needle)) throw new Error(`Missing final invoice requirement: ${needle}`)
          }
          const forbidden = [
            'await downloadDeliveryInvoiceWordImageFile(`Romas_Donuts_Invoices_4x6_${date}`, dayInvoices)',
            'await downloadDeliveryInvoiceWordImageFile(`Romas_Donuts_Invoice_4x6_${invoiceNumber}`, [freshInvoice])',
            '> PRINT ALL PDF ({invoiceDayFilter})</button>',
            '> DOWNLOAD IMAGES</button>',
            '> DOWNLOAD PDF</button>'
          ]
          for (const needle of forbidden) {
            if (s.includes(needle)) throw new Error(`Old invoice behavior remains: ${needle}`)
          }
          console.log('Final branded native Word invoice source verified.')
          NODE
          git diff --check

      - name: Commit verified app change
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo 'No App.jsx change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          git commit -m 'Restore branded native 4x6 Word invoice printing'
          git push origin main
